name: Generate Snake


permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"  
  workflow_dispatch:     

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # يولّد الـ SVG
      - uses: Platane/snk@v3
        with:
          github_user_name: chouaibtech5
          outputs: |
            dist/github-contribution-grid-snake.svg

      # يدفع الملف لفرع output
      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
